query CI_HEALTH_QUERY($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    hasWikiEnabled
    hasIssuesEnabled
    hasDiscussionsEnabled
    hasProjectsEnabled
    webCommitSignoffRequired

    headCommit: object(expression: "HEAD") {
      ... on Commit {
        oid
        tree {
          oid
        }
      }
    }

    object(expression: "HEAD:.github") {
      ... on Tree {
        entries {
          name
          object {
            ... on Blob {
              text
            }
            ... on Tree {
              entries {
                name
                object {
                  ... on Blob {
                    text
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  rateLimit {
    limit
    remaining
    cost
    resetAt
  }
}
