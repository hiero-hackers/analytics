query HIP_FILES_QUERY($owner:String!, $repo:String!, $expression:String!) {
  repository(owner:$owner, name:$repo) {
    object(expression:$expression) {
      ... on Tree {
        entries {
          name
          object {
            ... on Blob {
              text
            }
          }
        }
      }
    }
  }
  rateLimit{
    limit
    remaining
    cost
    resetAt
  }
}
