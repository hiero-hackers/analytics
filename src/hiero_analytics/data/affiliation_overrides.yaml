# Hand corrections to the generated affiliations map (affiliations.yaml).
#
# One row per GitHub login, lowercase, with the reason as the trailing comment:
#
#   login: "Organisation"  # evidence — who checked, when
#
# A row here wins over the generated value at run time (data_sources.affiliations
# merges the two files), reads 'manual' in the dashboard's method column, and
# survives every regeneration: 'hiero-analytics build_affiliations' never
# rewrites this file. It also outlives the person's spell on the governance
# roster; the generator warns about rows that no roster names, so prune or keep
# them deliberately.
#
# Values: an organisation name | "Independent" (solo, no employer) | "?" to
# unset a resolver guess you know to be wrong when the right answer is unknown.
#
# The reason is required (a test checks it): say what the evidence was, so the
# next person can tell whether it still holds.

