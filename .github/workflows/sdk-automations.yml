# The workflow that runs sdk-automations in this repository. The Action reads the
# repository's config through the API, so there is NO checkout step here, ever:
# a pull_request_target job that checks out the head would run a fork's code
# with this repository's token.
name: sdk-automations

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened, assigned, unassigned]
  issue_comment:
    types: [created]
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        closed,
        labeled,
        unlabeled,
      ]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

# One run at a time per item; the sweep is its own group, so a sweep and an event on the same
# item can overlap, and a comment created in that window may appear twice. The budget bounds it.
concurrency:
  group: sdk-automations-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Pinned to the v0.1.4 release commit; bump the SHA to take a new release.
      - uses: hiero-hackers/sdk-automations@7c5587bdf83d278a8419bac02817d8fb51cf62b9 # v0.1.4
        with:
          arm-writes: "false"
