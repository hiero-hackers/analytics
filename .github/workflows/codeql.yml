name: "CodeQL Advanced"

permissions:
  contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths-ignore:
            - "**/*.md"
    schedule:
        - cron: "00 12 * * *" # Runs every day at 12:00 UTC

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # required for all workflows
            security-events: write
            # required to fetch internal or private CodeQL packs
            packages: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: actions
                      build-mode: none
                    - language: python
                      build-mode: none
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-extended
                  dependency-caching: true

            - name: Set up Python
              if: matrix.language == 'python'
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.13"

            - name: Install uv
              if: matrix.language == 'python'
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true

            - name: Install dependencies
              if: matrix.language == 'python'
              run: uv sync --frozen --all-extras --dev

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
              with:
                  category: "/language:${{matrix.language}}"
