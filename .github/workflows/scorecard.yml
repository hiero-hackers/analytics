name: Scorecard supply-chain security

# OpenSSF Scorecard: scores this repo's security posture and uploads the results
# to the Security tab. Also feeds the public score at
# https://securityscorecards.dev and the README badge.

on:
    branch_protection_rule:
    schedule:
        - cron: "24 5 * * 1" # Weekly, Monday 05:24 UTC
    push:
        branches: ["main"]

# Top-level: least privilege. The analysis job elevates only what it needs.
permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        permissions:
            # Needed to upload the SARIF results to the code-scanning dashboard.
            security-events: write
            # Needed to publish results and get a badge (OIDC token).
            id-token: write

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run analysis
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  # Publish results to enable the public badge and the
                  # securityscorecards.dev entry for this repo.
                  publish_results: true

            # Retain the results for a couple of weeks so a run can be inspected
            # even if the code-scanning upload is unavailable.
            - name: Upload artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: SARIF file
                  path: results.sarif
                  retention-days: 14

            - name: Upload to code-scanning
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: results.sarif
