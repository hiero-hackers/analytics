name: Scorecard supply-chain security

# OpenSSF Scorecard: scores this repo's security posture and uploads the results
# to the Security tab. Also feeds the public score at
# https://securityscorecards.dev and the README badge.

on:
    branch_protection_rule:
    schedule:
        - cron: "24 5 * * 1" # Weekly, Monday 05:24 UTC
    push:
        branches: ["main"]

# Top-level: least privilege. The analysis job elevates only what it needs.
permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        permissions:
            # Needed to upload the SARIF results to the code-scanning dashboard.
            security-events: write
            # Needed to publish results and get a badge (OIDC token).
            id-token: write

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run analysis
              uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
              with:
                  results_file: results.sarif
                  results_format: sarif
                  # Publish results to enable the public badge and the
                  # securityscorecards.dev entry for this repo.
                  publish_results: true

            # Retain the results for a couple of weeks so a run can be inspected
            # even if the code-scanning upload is unavailable.
            - name: Upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: SARIF file
                  path: results.sarif
                  retention-days: 14

            - name: Upload to code-scanning
              uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.3.5
              with:
                  sarif_file: results.sarif
