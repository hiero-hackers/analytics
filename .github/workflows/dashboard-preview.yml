name: Dashboard Preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/hiero_analytics/**"
      - "web/**"
      - "pyproject.toml"
      - ".github/workflows/dashboard-preview.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build dashboard preview
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job later runs contributor-controlled npm scripts; don't
          # leave the checkout token in .git/config for them to reach.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # PRs can restore caches created on the base branch, but this workflow never
      # saves one. Contributor code therefore cannot replace the refresh baseline.
      - name: Restore analytics datasets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: outputs/data/datasets
          key: analytics-datasets-preview-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            analytics-datasets-

      # Ingestion changes need a live fetch because the base-branch datasets may
      # not contain new fields. Only recent records will carry newly-added fields;
      # historical backfill remains the scheduled refresh workflow's responsibility.
      # A three-dot diff compares the PR head against the merge-base, so movement
      # on main after the branch point never forces an unnecessary live fetch.
      #
      # Only the field-bearing layer triggers live mode: record shapes (models),
      # the ingest queries and parsers, and the governance snapshot. Transport
      # and rate-limit files (github_client, pagination, adaptive_limiter, …)
      # cannot introduce fields a cached dataset lacks, so touching them keeps
      # the fast offline path.
      - name: Select data mode
        id: data-mode
        run: |
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- src/hiero_analytics/data_sources/models.py \
               src/hiero_analytics/data_sources/github_ingest \
               src/hiero_analytics/data_sources/governance_config.py \
               src/hiero_analytics/data_sources/queries.py \
               src/hiero_analytics/data_sources/queries; then
            echo "offline=1" >> "$GITHUB_OUTPUT"
          else
            echo "offline=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build analytics data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HIERO_ANALYTICS_OFFLINE: ${{ steps.data-mode.outputs.offline }}
        run: uv run hiero-analytics

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same layout the Pages deploy publishes: the app at the root with its
      # data API and charts nested beneath it. Reviewers unzip the artifact and
      # serve it (python3 -m http.server -d <dir>) — the app fetches JSON over
      # HTTP, so file:// won't load data. Treat the preview from unfamiliar
      # contributors with the same care as any other contributor-authored code.
      # run_all emits the data API before it exits non-zero on any pipeline
      # failure, so build and upload even on failure (job still goes red) —
      # reviewers get the partial site instead of nothing.
      - name: Build preview site
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix web
          npm run build --prefix web
          mkdir -p preview/data
          cp -R web/dist/. preview/
          # A failed or rate-limited data step may leave no API or charts;
          # ship whatever exists — reviewers get the partial site (the job is
          # still red from the earlier step), not a missing artifact.
          if [ -d outputs/data/api ]; then
            cp -R outputs/data/api preview/data/api
          else
            echo "::warning::no data API produced; preview carries the app shell only"
          fi
          if [ -d outputs/charts ]; then
            cp -R outputs/charts preview/charts
          else
            echo "::warning::no charts produced"
          fi
          # The app loads its data over HTTP, so the artifact can't be opened
          # straight from the filesystem. README.txt names the one command that
          # serves it — deliberately not a script we ship and ask reviewers to
          # run, since on a fork PR that file is contributor-controlled and
          # "unzip and run this" is code execution on the reviewer's machine.
          printf 'This is a dashboard preview build.\n\nRun:  python3 -m http.server -d .\n\nThen open the URL it prints (http://localhost:8000/). A server is needed\nbecause the dashboard loads its data over HTTP: opening index.html directly\nshows an empty page. Treat the contents as contributor-authored code.\n' > preview/README.txt

      - name: Upload dashboard preview
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-preview-${{ github.event.pull_request.number }}
          path: preview
          if-no-files-found: error
          retention-days: 7

      # The follow-up "Dashboard Preview Comment" workflow posts a PR comment
      # linking to the artifact above. It runs on workflow_run (base-repo context)
      # so this build job can stay contents: read with no PR-write token — the only
      # way to comment on fork PRs without granting write to contributor code.
      # workflow_run cannot read the PR number reliably for forks, so pass it along.
      - name: Record PR number for the comment workflow
        if: ${{ !cancelled() }}
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload preview metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-preview-meta
          path: pr-number.txt
          if-no-files-found: error
          retention-days: 7
