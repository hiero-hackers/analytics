name: Refresh Analytics Data

on:
  schedule:
    # Every 5 days at 9 AM UTC. Keeps gaps under the 7-day cache-eviction
    # window so the incremental dataset cache stays warm.
    - cron: '0 9 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

# Never let a manual dispatch overlap a scheduled run: both would draw from the
# same hourly GraphQL point budget and each would crawl (or time out).
concurrency:
  group: update-analytics
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    # A first full fetch of a new dataset under the Actions token's 1,000
    # GraphQL points/hour spends most of its wall time sleeping for budget
    # resets; give it the whole runner allowance rather than an eager cutoff.
    timeout-minutes: 355

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      # Persist the incremental-fetch datasets across runs without committing
      # them to git. A unique key per run always saves; restore-keys pulls the
      # most recent prior dataset. If the cache is ever evicted, the pipeline's
      # 30-day self-heal just does one full fetch, then resumes incrementally.
      - name: Restore incremental datasets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: outputs/data/datasets
          key: analytics-datasets-${{ github.run_id }}
          restore-keys: |
            analytics-datasets-

      # Prefer a PAT when one is configured: the built-in Actions token gets only
      # 1,000 GraphQL points/hour per repo, so a first full fetch of a new dataset
      # can rate-limit-sleep past the job timeout. A classic PAT (public_repo is
      # enough) gets 5,000. Falls back to the Actions token when the secret is
      # absent, so forks keep working.
      - name: Run all analytics pipelines
        env:
          GITHUB_TOKEN: ${{ secrets.ANALYTICS_PAT || secrets.GITHUB_TOKEN }}
          # Fewer parallel GraphQL workers = smaller burst load, so fewer 502s
          # and secondary-rate-limit 403s. A repo chunk that still fails on the
          # *first* fetch of a dataset fails the whole run (no baseline to hold
          # a watermark against), so gentleness beats speed here — rate-limit
          # sleeps dominate wall time anyway.
          GITHUB_MAX_WORKERS: "3"
        run: uv run hiero-analytics

      # Only persist datasets when the run succeeds. Saving after a failed run
      # would let a partial snapshot become the next incremental baseline
      # (restore picks the most recent analytics-datasets- key); on failure we
      # keep the last good cache and let the next run resume from it.
      - name: Save incremental datasets
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: outputs/data/datasets
          key: analytics-datasets-${{ github.run_id }}

      # Archive the exact snapshot the charts were drawn from. The cache above
      # serves a different purpose: it is mutable, evictable, and reachable only
      # by the next run, so it cannot answer "what data produced this chart?".
      # This artifact is immutable and addressable by run, and it carries
      # SNAPSHOT.json (revision, per-dataset watermarks and SHA-256s, and any
      # failed pipelines) so it describes itself without the workflow log.
      #
      # Runs even when the pipeline step failed: a partial snapshot is exactly
      # what you want to inspect when diagnosing a bad refresh, and the manifest
      # records which pipelines failed.
      - name: Archive dataset snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-snapshot-${{ github.run_id }}-${{ github.sha }}
          path: outputs/data/datasets
          # Long enough to cover several refresh cycles when tracing a chart back,
          # short enough that 50+ MB snapshots every 5 days do not accumulate
          # indefinitely against the repository's storage quota.
          retention-days: 90
          if-no-files-found: warn

      # Hand-off for the archive-snapshot job: the emitted JSON API plus the
      # run's provenance manifest, staged as the exact tree the archive branch
      # carries. Chart PNGs are excluded deliberately — heavy, and the numbers
      # behind them are already in the JSON.
      #
      # Success-only on purpose: the durable archive must contain only what was
      # actually published, so this shares the pipeline-success gate with the
      # Pages deploy rather than the always() the diagnostic artifact above uses.
      - name: Stage API snapshot
        run: |
          set -euo pipefail
          mkdir -p snapshot/api
          cp -R outputs/data/api/v1 snapshot/api/v1
          cp outputs/data/datasets/SNAPSHOT.json snapshot/SNAPSHOT.json

      - name: Hand off API snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-snapshot-${{ github.run_id }}
          path: snapshot
          retention-days: 7
          if-no-files-found: error

      # The web dashboard (web/): a static Vite build that renders the JSON
      # data API. The app uses relative URLs, so its data and charts nest
      # beneath it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        run: |
          npm ci --prefix web
          npm run build --prefix web

      # Publish to GitHub Pages: the web app is the site root. /v2/ (where the
      # app lived while the legacy generated dashboard held the root) redirects
      # to the root so previously shared links keep working.
      - name: Assemble Pages site
        run: |
          mkdir -p _site/data _site/v2
          cp -R web/dist/. _site/
          cp -R outputs/data/api _site/data/api
          cp -R outputs/charts _site/charts
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="../"><p>Moved to <a href="../">the site root</a>.</p>' > _site/v2/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Append this run's data API to the snapshot archive: an orphan branch whose
  # working tree only ever holds the latest snapshot, so history lives in the
  # commits rather than in an ever-growing directory of dated copies. Git is
  # then the index, the time machine, and the diff engine:
  #
  #   latest        git show data/snapshots:api/v1/manifest.json
  #   by date       git rev-list -1 --before=2026-08-01 data/snapshots
  #   diff two runs git diff <sha1> <sha2> -- api/v1/
  #
  # See docs/snapshots.md. Runs only when refresh-data succeeded, so a run with
  # failed pipelines never enters the archive.
  archive-snapshot:
    name: Archive API snapshot
    needs: refresh-data
    runs-on: ubuntu-latest
    # The only job in this workflow that writes to the repository, and it
    # writes to one branch that never holds code. The workflow's top-level
    # permissions stay contents: read.
    permissions:
      contents: write
    concurrency:
      group: archive-snapshot
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download API snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-snapshot-${{ github.run_id }}
          path: snapshot

      # Worked in its own throwaway clone rather than a checkout of main: the
      # archive branch shares no history with the code, and a shallow fetch of
      # just its tip is all that is needed to add a commit.
      - name: Commit snapshot to the archive branch
        env:
          BRANCH: data/snapshots
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir archive && cd archive
          git init -q
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch -q --depth=1 origin "$BRANCH" 2>/dev/null; then
            git checkout -q FETCH_HEAD
            git checkout -qB "$BRANCH"
            # Clear the tree so a section deleted upstream disappears here too,
            # rather than lingering as an orphan the next reader mistakes for live.
            git rm -rq --ignore-unmatch .
          else
            echo "Archive branch $BRANCH does not exist yet; creating it."
            git checkout -q --orphan "$BRANCH"
          fi

          cp -R ../snapshot/. .
          git add -A

          # Idempotent: a re-run whose output is byte-identical adds nothing, so
          # replays and manual dispatches are safe and the log stays meaningful.
          if git diff --cached --quiet; then
            echo "Snapshot identical to the archive tip; nothing to commit."
            exit 0
          fi

          # gpgsign off explicitly: this is a bot commit on a data branch, and
          # inheriting a signing config the runner has no key for would fail
          # the job with a misleading error.
          git -c commit.gpgsign=false \
            commit -q -m "snapshot: $(date -u +%Y-%m-%d) run ${GITHUB_RUN_ID} code ${GITHUB_SHA:0:7}"
          git push -q origin "$BRANCH"
          echo "Archived $(du -sh . | cut -f1) to $BRANCH."

  # Publish the freshly-built dashboard to GitHub Pages. Runs after the data refresh
  # regardless of whether the data changed, so the public page always reflects the
  # most recent run. Requires Pages "Source: GitHub Actions" to be enabled once in
  # the repository settings.
  deploy-pages:
    name: Deploy dashboard to GitHub Pages
    needs: refresh-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
