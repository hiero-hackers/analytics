name: Bug report
description: Something in the analytics or dashboard is broken or wrong
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for submitting a bug report!

        Before submitting:
        1. Search existing issues to see if it has already been reported
        2. If you're reporting a security vulnerability, please disclose responsibly via our [bug bounty program](https://hedera.com/bounty)
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen? If a chart or number looks wrong, name the chart and say what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `uv run hiero-analytics <pipeline>` (or open the dashboard at ...)
        2. Look at '...'
        3. See the error / wrong value
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or the command output relevant to the problem.
      placeholder: |
        ![Screenshot](bug.png)

        ```
        paste terminal output here
        ```
