# sdk-automations.yml — read by the sdk-automations Action from the default branch.
# Dry-run only: it reads and decides, writes nothing, and records each proposed change as
# a `wouldApply` finding in the job summary. The file's `mode` is `active`, and each block
# states `mode: dry-run` of its own, which holds it: a capability goes live in its own
# reviewed diff, by deleting its block's `mode` line, once the workflow's `arm-writes`
# input — the second gate — is `"true"`.

mode: active

capabilities:
  triageQueue: # a new issue is labelled awaitingTriage
    enabled: true
    mode: dry-run
    welcome: false

  prDashboard: # one comment per pull request: what stops it being reviewable
    enabled: true
    mode: dry-run
    checks:
      dcoSignoff:
        enabled: true
      gpgSignature:
        enabled: true
      mergeConflicts:
        enabled: true
      linkedIssues:
        enabled: true
        assignedIssues:
          enabled: true
    applyLabels: [needsRevision, needsReview]

  configReport: # a pull request that changes this file gets one comment saying what it would mean
    enabled: true
    mode: dry-run

  inactivity: # on the hourly schedule: remind about stalled work, then release it
    enabled: true
    mode: dry-run
    issues:
      enabled: true
      reap:
        enabled: true
    pullRequests:
      enabled: true
      reapWhen:
        draft:
          enabled: true
          reap:
            enabled: true
        changesRequested:
          enabled: true
          reap:
            enabled: true
        needsRevision:
          enabled: true
          reap:
            enabled: true

  assignment: # a contributor claims an issue with a comment, and releases it the same way
    enabled: true
    mode: dry-run
    autoAssign:
      enabled: true
      notClaimableWhen: [blocked]
    unassign:
      enabled: true

mappings:
  labels:
    blocked: "blocked" # this repository's existing label; the App reads it and never sets it
  commands:
    assign: "/assign"
    unassign: "/unassign"
    working: "/working"
  skills: # this repository's existing difficulty labels
    goodFirstIssue: "good first issue"
    beginner: "beginner"
    intermediate: "intermediate"
    advanced: "advanced"

principals:
  maintainerTeam: analytics-maintainers
