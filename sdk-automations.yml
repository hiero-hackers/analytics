# sdk-automations.yml — read by the sdk-automations Action from the default branch.
# Observe only: it reads and decides, and writes nothing. Every row in a run's job summary
# is a decision it would have recorded, never an act. One capability for now; more are added
# one at a time, each in its own reviewed diff, once the engine carries a mode per capability.

mode: observe

capabilities:
  triageQueue:
    enabled: true
    welcome: false

principals:
  maintainerTeam: analytics-maintainers
