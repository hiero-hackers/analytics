[project]
name = "hiero_analytics"
dynamic = ["version"]
description = "Hiero analytics"
maintainers = [
    { name = "Sophie Bulloch", email = "exploreriii57@gmail.com" },
    { name = "Mona Eid", email = "monaa_eid@hotmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "networkx>=3.6.1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]

[project.scripts]
hiero-analytics = "hiero_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<10",
]

lint = [
    "ruff>=0.15.22,<1",
    "pyright>=1.1.390,<2",
    "pre-commit>=4.0,<5",
]

[tool.uv]
default-groups = ["dev", "lint"]

[build-system]
requires = ["pdm-backend", "setuptools_scm"]
build-backend = "pdm.backend"

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "dirty-tag"

[tool.pdm]
version = { source = "scm" }
package-dir = {"" = "src"}

[tool.pdm.build]
excludes = ["**/.pytest_cache"]

# Report-only for now (the CI step does not fail the build): establish the
# baseline, fix incrementally, then ratchet to blocking.
[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=hiero_analytics --cov-report=term-missing --cov-fail-under=70 --import-mode=importlib"

[tool.ruff]
line-length = 120
# Lowest supported Python (matches requires-python); with py314 the formatter
# emits 3.14-only syntax (e.g. PEP 758 unparenthesized except) that breaks 3.11-3.13.
target-version = "py311"

[tool.ruff.lint]
select = [
    "D",    # docstrings
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear (real bugs)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # simplify logic
    "PERF", # performance traps
    "ARG",  # unused function arguments
    "RET",  # return consistency
    "RSE",  # exception correctness
]
ignore = [
    "D212",     # disable "summary on same line"
    "E501",     # line length -> formatter
    "B008",     # function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"
